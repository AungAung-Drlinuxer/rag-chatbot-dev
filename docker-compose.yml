# Whole application on one machine — `docker compose up` from a clean clone.
#
# This is the laptop / single-VM stack. A Kubernetes install does not use this file; see
# docs/DEPLOYMENT.md and infra/scripts/install.sh for that.
#
#   cp .env.example .env        # set POSTGRES_PASSWORD and the first admin password
#   docker compose up -d --build
#   open http://localhost:8080  # sign in with ADMIN_USER / ADMIN_PASSWORD
#
# Ports are deliberately unusual so they cannot collide with a local Postgres, Redis or
# Ollama you already run: 55433 (db), 6380 (cache), 11434 (ollama), 8080 (app).
name: rag-chatbot

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg2://app:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/assistant
  REDIS_URL: redis://redis:6379/0
  OLLAMA_URL: http://ollama:11434
  RERANK_MODE: remote
  RERANK_URL: http://rerank:8080
  CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: assistant
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d assistant"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.5.7
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # One-shot: the chat pipeline cannot embed anything until this model exists.
  ollama-models:
    image: ollama/ollama:0.5.7
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull nomic-embed-text"]
    restart: "no"

  rerank:
    build:
      context: ./services/rerank
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')\""]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 300s

  # One-shot: schema, extensions, and the first administrator.
  init:
    build:
      context: ./backend
      args:
        BAKE_RERANKER: "0"
    image: rag-chatbot-backend:local
    command: ["python", "-m", "app.bootstrap", "--init", "--admin", "${ADMIN_USER:-admin}"]
    environment:
      <<: *backend-env
      BOOTSTRAP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      args:
        BAKE_RERANKER: "0"
    image: rag-chatbot-backend:local
    environment: *backend-env
    depends_on:
      init:
        condition: service_completed_successfully
      ollama-models:
        condition: service_completed_successfully
      rerank:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  worker:
    image: rag-chatbot-backend:local
    command: ["celery", "-A", "workers.celery_app", "worker", "-l", "info"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy

  beat:
    image: rag-chatbot-backend:local
    command: ["celery", "-A", "workers.celery_app", "beat", "-l", "info"]
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
