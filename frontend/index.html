<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IT Help Chatbot</title>
    <!-- Pre-paint theme bootstrap. Preferences live in PostgreSQL and the app applies them
         after the settings fetch, but the *appearance* also keeps one local key so a
         signed-out page (the login screen) and a hard reload paint in the user's last
         chosen theme instead of flashing light first. No identity, no content — one word. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("ith-theme");
          if (t !== "dark" && t !== "light") {
            /* First visit: follow the operating system instead of forcing light, so a
               dark desktop does not get a white login screen. */
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
