# === rag-chatbot DEV — Postgres backups to S3 =================================
# Same mechanism as production (CNPG + the barman-cloud plugin writing to s3.drlinuxer.com),
# so a restore drill is the same procedure in both places.
#
# WHY A SEPARATE PREFIX: dev and prod write to the same bucket, but a dev backup must never
# be restorable-looking as the production archive. `rag-chatbot-dev-postgres` keeps them
# apart, and 7-day retention is enough for a preview environment (prod keeps 14d).
#
# CREDENTIALS: the `cnpg-backup-s3` Secret is created out-of-band in this namespace with the
# same keys the production ObjectStore expects (ACCESS_KEY_ID / SECRET_ACCESS_KEY / REGION).
# It is never committed; see docs/postgres-backup-restore.md.
#
# APPLY ORDER: after 20-database.yaml, and after the Secret exists — the ObjectStore is what
# the plugin reads at archive time, so a missing Secret fails WAL archiving, not the DB.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-backup-store
  namespace: rag-chatbot-dev
spec:
  retentionPolicy: 7d
  configuration:
    destinationPath: s3://production-backups/rag-chatbot-dev-postgres
    endpointURL: https://s3.drlinuxer.com
    s3Credentials:
      accessKeyId:
        name: cnpg-backup-s3
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backup-s3
        key: SECRET_ACCESS_KEY
      region:
        name: cnpg-backup-s3
        key: REGION
    wal:
      compression: gzip
    data:
      compression: gzip
  instanceSidecarConfiguration:
    env:
      # Some S3 gateways reject the newer default checksum headers; production sets these
      # two explicitly and dev must match or every upload fails with a 400.
      - name: AWS_REQUEST_CHECKSUM_CALCULATION
        value: when_required
      - name: AWS_RESPONSE_CHECKSUM_VALIDATION
        value: when_required
---
# Nightly base backup at 19:45 (prod is 19:30), plus continuous WAL archiving from the
# cluster spec — together these give point-in-time recovery, not just "last night".
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-dev-nightly
  namespace: rag-chatbot-dev
spec:
  cluster:
    name: postgres-dev
  schedule: "0 45 19 * * *"
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  backupOwnerReference: self
  immediate: false
  suspend: false
