# Redis for the dev workspace: one master + one sentinel, password from backend-secrets.
#
# Deliberately smaller than the prod topology (3 data + 3 sentinel): dev runs one replica of
# each, and the application still talks to Redis through Sentinel so the code path that prod
# uses is the code path dev exercises. Scaling to 3/3 is a `replicas:` change, nothing else.
#
# The password never lives in this file. Both pods read REDIS_PASSWORD from the existing
# backend-secrets Secret; the sentinel config is templated at start-up by an init container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: rag-chatbot-dev
data:
  redis.conf: |
    bind 0.0.0.0
    port 6379
    protected-mode no
    daemonize no
    appendonly yes
    save ""
    dir /data
    replica-announce-ip $(POD_IP)
  sentinel.conf: |
    bind 0.0.0.0
    port 26379
    protected-mode no
    daemonize no
    requirepass __REDIS_PASSWORD__
    sentinel resolve-hostnames yes
    sentinel announce-hostnames yes
    sentinel monitor mymaster redis-service.rag-chatbot-dev.svc.cluster.local 6379 1
    sentinel auth-pass mymaster __REDIS_PASSWORD__
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 60000
    sentinel parallel-syncs mymaster 1
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: rag-chatbot-dev
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: data
  ports:
    - name: client
      port: 6379
      targetPort: client
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: rag-chatbot-dev
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: data
  ports:
    - name: client
      port: 6379
      targetPort: client
---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-service
  namespace: rag-chatbot-dev
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: sentinel
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-data
  namespace: rag-chatbot-dev
spec:
  replicas: 1
  serviceName: redis-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: data
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: data
    spec:
      securityContext:
        fsGroup: 999
      initContainers:
        - name: init-config
          image: redis:7.4
          command: ["/bin/sh", "-c"]
          args:
            - cp /readonly/redis.conf /conf/redis.conf
          volumeMounts:
            - { name: conf, mountPath: /conf }
            - { name: conf-readonly, mountPath: /readonly }
      containers:
        - name: redis
          image: redis:7.4
          command:
            - redis-server
            - /conf/redis.conf
            - --requirepass
            - $(REDIS_PASSWORD)
            - --masterauth
            - $(REDIS_PASSWORD)
            - --replica-announce-ip
            - $(POD_IP)
          env:
            - name: POD_IP
              valueFrom:
                fieldRef: { fieldPath: status.podIP }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: backend-secrets, key: REDIS_PASSWORD }
          ports:
            - { name: client, containerPort: 6379 }
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "500m", memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: conf, mountPath: /conf }
      volumes:
        - name: conf
          emptyDir: {}
        - name: conf-readonly
          configMap:
            name: redis-config
            items: [{ key: redis.conf, path: redis.conf }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: truenas-iscsi
        resources:
          requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-sentinel
  namespace: rag-chatbot-dev
spec:
  replicas: 1
  serviceName: redis-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: sentinel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: sentinel
    spec:
      initContainers:
        - name: sentinel-config-init
          image: redis:7.4
          command: ["sh", "-c"]
          args:
            - |
              sed "s|__REDIS_PASSWORD__|$REDIS_PASSWORD|g" /readonly-config/sentinel.conf > /conf/sentinel.conf
              chmod 644 /conf/sentinel.conf
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: backend-secrets, key: REDIS_PASSWORD }
          volumeMounts:
            - { name: conf, mountPath: /conf }
            - { name: readonly-config, mountPath: /readonly-config }
      containers:
        - name: sentinel
          image: redis:7.4
          command: ["redis-server", "/conf/sentinel.conf", "--sentinel"]
          ports:
            - { name: sentinel, containerPort: 26379 }
          livenessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -p 26379 -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            exec:
              command: ["sh", "-c", "redis-cli -p 26379 -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
            initialDelaySeconds: 5
            periodSeconds: 10
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: backend-secrets, key: REDIS_PASSWORD }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: conf, mountPath: /conf }
      volumes:
        - name: conf
          emptyDir: {}
        - name: readonly-config
          configMap:
            name: redis-config
            items: [{ key: sentinel.conf, path: sentinel.conf }]
