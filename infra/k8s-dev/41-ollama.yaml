# Embedding runtime for the dev workspace.
#
# Only the embedding model is needed here — chat completions go to the provider configured in
# Settings → AI service. The image already ships `nomic-embed-text`, so there is no PVC and no
# model download: a mounted volume at /root/.ollama would hide the bundled models, which is
# exactly what an empty volume did on the first attempt.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: rag-chatbot-dev
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: ai-runtime
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/component: ai-runtime
    spec:
      containers:
        - name: ollama
          image: harbor.drlinuxer.com/rag-chatbot-dev/ollama:0.5.7-models
          imagePullPolicy: IfNotPresent
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_MODELS, value: /root/.ollama/models }
            - { name: OLLAMA_KEEP_ALIVE, value: 30m }
            - { name: OLLAMA_NUM_PARALLEL, value: "4" }
            - { name: OLLAMA_MAX_LOADED_MODELS, value: "1" }
          ports:
            - { name: http, containerPort: 11434 }
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 2Gi }
            limits: { cpu: "2", memory: 6Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: rag-chatbot-dev
spec:
  selector:
    app.kubernetes.io/name: ollama
  ports:
    - { name: http, port: 11434, targetPort: http }
