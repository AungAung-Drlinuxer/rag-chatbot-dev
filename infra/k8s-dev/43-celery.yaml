# Background jobs for the dev workspace.
#
# Both pods use the SAME image as the backend (backend:dev-1.0.56) and the same config/secrets,
# so a scheduled job can never talk to a different database or broker than the API it belongs
# to. Beat only enqueues; the worker does the work (KB sync every 30 minutes).
#
# Redis is reached through Sentinel (REDIS_MODE=sentinel in backend-config), which is what
# app/persistence/redis.py reads for both the broker and the result backend.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: rag-chatbot-dev
  labels:
    app.kubernetes.io/name: celery-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: celery-worker
          image: harbor.drlinuxer.com/rag-chatbot-dev/backend:dev-1.0.56
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - workers.celery_app
            - worker
            - -l
            - info
            - --concurrency=2
            # A stuck task used to hold the worker forever; the KB sync itself takes ~9
            # minutes on CPU embeddings, so the hard limit sits well above that.
            - --soft-time-limit=1500
            - --time-limit=1800
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef:    { name: backend-secrets }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: rag-chatbot-dev
  labels:
    app.kubernetes.io/name: celery-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: celery-beat
  template:
    metadata:
      labels:
        app.kubernetes.io/name: celery-beat
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: celery-beat
          image: harbor.drlinuxer.com/rag-chatbot-dev/backend:dev-1.0.56
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - workers.celery_app
            - beat
            - -l
            - info
            # The image runs as uid 1000 with a read-only /app; beat's default schedule
            # file lives there and crashes with "Permission denied" on first tick.
            - --schedule=/tmp/celerybeat-schedule
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef:    { name: backend-secrets }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }
